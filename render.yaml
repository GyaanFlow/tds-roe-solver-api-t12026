services:
  - type: web
    name: tds-roe-solver-api
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      # OPTIONAL last-resort fallback for GA4 Q3 & Q5 LLM calls. Normally the
      # caller's token is taken per-request from the URL path (…/ga4/<email>/<token>/…),
      # so the owner does NOT pay and this can stay unset. sync:false = not stored in repo.
      - key: AIPIPE_TOKEN
        sync: false
      - key: Q10_CSV_PATH
        value: "/app/T22026/GA0/Q10/q-fastapi.csv"
      - key: Q14_OUTPUT_DIR
        value: "/tmp/q14_output"
      - key: Q16_WORK_ROOT
        value: "/tmp/q16_work"
      - key: Q19_WORK_ROOT
        value: "/tmp/q19_work"
    healthCheckPath: /health

