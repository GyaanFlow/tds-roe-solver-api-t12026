services:
  - type: web
    name: t22026-ga0-q14-api
    env: python
    rootDir: T22026/GA0/Q14
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: MAX_UPLOAD_MB
        value: "12"
      - key: Q14_OUTPUT_DIR
        value: output
      - key: CORS_ALLOW_ORIGINS
        value: "*"


