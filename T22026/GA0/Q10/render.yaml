services:
  - type: web
    name: t22026-ga0-q10-api
    env: python
    rootDir: T22026/GA0/Q10
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: Q10_CSV_PATH
        value: q-fastapi.csv
      - key: MAX_CLASS_FILTERS
        value: "100"
      - key: CORS_ALLOW_ORIGINS
        value: "*"


