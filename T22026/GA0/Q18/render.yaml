services:
  - type: web
    name: t22026-ga0-q18-api
    env: python
    rootDir: T22026/GA0/Q18
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 3
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: Q18_UPSTREAM_OLLAMA
        value: http://127.0.0.1:11434
      - key: Q18_NGROK_TOKEN
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: "*"


